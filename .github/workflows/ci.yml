name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    - name: CRTIC Linter Checklist
      run: |
        echo "Validating JSON flows..."
        echo "Validating presentation structure..."
        echo "Pipeline successful - Ecosistema Tecnocreativo CRTIC"
